[workspace]
resolver = "2"
members = [
    "crates/z-engine",
    "crates/z-wasm",
    "crates/z-node-launcher",
    "crates/z-desktop",
]
# Patched upstream crates (see [patch.crates-io]); each builds and tests on its own.
exclude = ["vendor/zakura"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/tzarebczan/z-stack"
authors = ["tzarebczan"]

[workspace.dependencies]
# --- Zakura Common (crypto) — keep use-paths upstream-shaped via package rename ---
# Pin to 1.2.0 to match zakura-client-backend 0.1.0-rc5 (=1.2.0 orchard/keys/…).
orchard = { version = "=1.2.0", package = "zakura-orchard", default-features = false }
zcash_keys = { version = "=1.2.0", package = "zakura-keys", default-features = false }
zcash_primitives = { version = "=1.2.0", package = "zakura-primitives", default-features = false }
zcash_proofs = { version = "=1.2.0", package = "zakura-proofs", default-features = false }

# --- Zakura wallet-libraries ---
zcash_client_backend = { version = "0.1.0-rc5", package = "zakura-client-backend", default-features = false }
zcash_client_sqlite = { version = "0.1.0-rc5", package = "zakura-client-sqlite", default-features = false }
pczt = { version = "0.1.0-rc3", package = "zakura-pczt", default-features = false }

# --- Workspace crates ---
z-engine = { path = "crates/z-engine", default-features = false }

# --- App / tooling ---
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
gpui = "0.2.2"
wasm-bindgen = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1

# Auditable wasm32 field optimizations. See docs/UPSTREAM.md and patches/zakura/.
# Native arithmetic and published crate versions are unchanged.
[patch.crates-io]
zakura-pasta-curves = { path = "vendor/zakura/zakura-pasta-curves" }
zakura-bls12-381 = { path = "vendor/zakura/zakura-bls12-381" }
zakura-jubjub = { path = "vendor/zakura/zakura-jubjub" }
