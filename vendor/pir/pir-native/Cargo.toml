[package]
name = "pir-native"
version = "0.1.0"
edition = "2021"
description = "The native ReinspiRING two-mask m29 PIR helpers Enhance, Status and Transparent share"
license = "MIT"
repository = "https://github.com/valargroup/wallet-pir"

[lib]
name = "pir_native"
path = "src/lib.rs"

[dependencies]
# `native-reinspiring` only exposes `ipir_sp::native`; it changes no existing
# ipir-sp behaviour. This crate has no features of its own, so depending on it
# never switches the q48 Enhance binaries: only `enhance-pir/native-reinspiring`
# does that, and nothing here enables it.
ipir-sp = { version = "=0.1.0-rc.7", features = ["native-reinspiring"] }
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
reinspiring = "=0.1.3-rc.1"

[dev-dependencies]
hex = "0.4"
sha2 = "0.10"
