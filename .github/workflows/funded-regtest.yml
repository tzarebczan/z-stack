name: funded-regtest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  funded:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: z-stack-ci-${{ github.run_id }}-${{ github.run_attempt }}
      Z_STACK_WASM_MT_TOOLCHAIN: nightly-2026-09-22
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build the production candidate
        run: |
          cargo install wasm-pack --version 0.15.0 --locked
          rustup toolchain install "$Z_STACK_WASM_MT_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add wasm32-unknown-unknown --toolchain "$Z_STACK_WASM_MT_TOOLCHAIN"
          pnpm build:sdk
          pnpm exec playwright install --with-deps chromium
      - name: Native and installed-WASM funded acceptance
        run: |
          pnpm regtest:up
          pnpm test:sdk:regtest
          node scripts/test-packages.mjs --funded-regtest
      - name: Remove only this run's disposable fixture
        if: always()
        run: docker compose -f infra/compose/docker-compose.regtest.yml down --volumes
