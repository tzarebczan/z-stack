name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a PR cancels that PR's older run. Pushes to main are never
# cancelled or grouped (one group per commit), so each one seeds the cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same release used for the verified local production MT build.
  Z_STACK_WASM_MT_TOOLCHAIN: nightly-2026-09-22
  CARGO_BUILD_JOBS: "2"

jobs:
  native:
    # Forks can run release checks without a third-party runner installation.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Panics and backtraces keep file/line; full debuginfo only slows linking
      # and bloats the cache.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      # PRs restore main's cache; only main saves, so PRs cannot evict it.
      # target/vendor-tests is inside target/ and is cached with it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'ci/speedups' }}
      - name: Rust formatting
        run: cargo fmt --all -- --check
      # Dependencies (proving, curves) are optimized for the test builds only;
      # z-engine itself stays unoptimized and debug assertions and overflow
      # checks stay on. Measured: the engine tests run about 2x faster.
      - name: Engine check + tests
        run: |
          cargo check -p z-engine --features native,cli
          cargo test --config 'profile.dev.package."*".opt-level=2' -p z-engine --features native --lib
      - name: Desktop check
        run: cargo check -p z-desktop
      - name: Node launcher check
        run: cargo check -p z-node-launcher
      - name: Wasm target (engine default-features off)
        run: cargo check -p z-wasm --target wasm32-unknown-unknown
      - name: Patched field crates (wasm32 backend tests run natively too)
        run: |
          for c in zakura-pasta-curves zakura-bls12-381 zakura-jubjub; do
            (cd "vendor/zakura/$c" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/vendor-tests" cargo test --release --lib)
          done
      - name: Compile ignored regtest test (no docker)
        run: cargo test --config 'profile.dev.package."*".opt-level=2' -p z-engine --test regtest --no-run

  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown
      - name: Threaded WASM toolchain
        run: |
          rustup toolchain install "$Z_STACK_WASM_MT_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add wasm32-unknown-unknown --toolchain "$Z_STACK_WASM_MT_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ env.Z_STACK_WASM_MT_TOOLCHAIN }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'ci/speedups' }}
      # Prebuilt, checksum-verified binary instead of compiling it every run.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: wasm-pack@0.15.0
      # check:licenses reads crate sources offline; fetch them all up front.
      - name: Fetch crates
        run: cargo fetch --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Test against both production artifacts; several lifecycle tests and
      # package-export checks need real WASM, not executable stubs.
      - name: Build production WASM and integrator packages
        run: |
          pnpm build:wasm
          # The threaded build uses another toolchain and RUSTFLAGS; its own
          # target directory stops the two builds invalidating each other.
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/wasm-mt" pnpm build:wasm:mt
          pnpm --filter @z-stack/core build
          pnpm --filter @z-stack/passkey build
          pnpm --filter @z-stack/sdk build
          pnpm --filter @z-stack/base build
      - name: SDK, core, and passkey types and regression tests
        run: |
          pnpm --filter @z-stack/core typecheck
          pnpm --filter @z-stack/passkey typecheck
          pnpm --filter @z-stack/sdk typecheck
          pnpm --filter @z-stack/base typecheck
          pnpm test
          pnpm check:docs
          pnpm docs:api
          pnpm check:patches
          pnpm check:licenses
          pnpm test:packages
          pnpm test:base:package
          pnpm test:combined:package
      - name: Browser diagnostic app production build
        run: pnpm web:build
      - name: Chromium, Firefox and WebKit packaged consumers
        run: |
          pnpm exec playwright install --with-deps chromium firefox webkit
          pnpm test:packages:browser
          pnpm test:base:browser
      - name: Reviewable API reference
        uses: actions/upload-artifact@v4
        with:
          name: api-reference-${{ github.sha }}
          path: docs/api/
          retention-days: 14
          if-no-files-found: error
      - name: Preview archives
        run: |
          pnpm pack:sdk
          pnpm pack:base
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-preview-${{ github.sha }}
          path: artifacts/*.tgz
          retention-days: 14
          if-no-files-found: error

  # Branch protection requires a check named "rust". This gate keeps that name
  # and passes only when every job above passed (a cancel or skip fails it).
  rust:
    if: always()
    needs: [native, sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "native/sdk: $RESULTS"
          for r in $RESULTS; do test "$r" = success; done
