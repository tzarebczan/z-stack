[package]
name = "z-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "wasm-bindgen façade over z-engine"
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
z-engine = { workspace = true, default-features = false, features = [
    "transparent-inputs",
    "wasm-prove",
    "hardware",
] }
wasm-bindgen.workspace = true
js-sys = "0.3"
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }
getrandom = { version = "0.4", features = ["wasm_js"] }
rayon = "1.10"
wasm-bindgen-rayon = { version = "1.3", optional = true }

[features]
default = ["console_error_panic_hook"]
# SharedArrayBuffer + Rayon workers (old WebZjs path). Requires atomics build.
multicore = ["dep:wasm-bindgen-rayon", "z-engine/wasm-multicore"]
# Orchard/Ironwood circuit in the wasm blob. Sapling params stay separate.
prove = ["z-engine/wasm-prove"]
# Signs a PCZT from a caller-supplied mnemonic. Production wasm leaves this off.
simulator = []
