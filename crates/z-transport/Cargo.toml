[package]
name = "z-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Composable, fail-closed network hops (Direct, SOCKS5/Nym, Tor, RFC 9458 OHTTP) and pluggable PIR transport primitives"

[features]
default = ["native", "ohttp"]
native = [
    "dep:reqwest",
    "dep:tokio",
    "dep:url",
]
ohttp = [
    "dep:ohttp",
    "dep:bhttp",
]
tor-arti = [
    "native",
    "dep:arti-client",
    "dep:tor-rtcompat",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:webpki-roots",
]

[dependencies]
async-trait = "0.1"
bytes = "1"
http = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Native HTTP & SOCKS5h (Tor / Nym / Orbot)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "http2"], optional = true }
tokio = { version = "1", features = ["rt", "time", "sync", "io-util", "net"], optional = true }
url = { version = "2", optional = true }

# RFC 9458 Oblivious HTTP + Binary HTTP (matches coffer-cloud-client exact versions)
ohttp = { version = "=0.7.2", default-features = false, features = ["client", "rust-hpke"], optional = true }
bhttp = { version = "=0.8.0", optional = true }

# Optional embedded Tor (Arti) — native Desktop / CLI only, never linked in WASM
arti-client = { version = "0.43", default-features = false, features = ["tokio", "rustls", "compression"], optional = true }
tor-rtcompat = { version = "0.43", default-features = false, features = ["tokio", "rustls"], optional = true }
hyper = { version = "1", features = ["client", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy"], optional = true }
http-body-util = { version = "0.1", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }

[dev-dependencies]
ohttp = { version = "=0.7.2", default-features = false, features = ["client", "server", "rust-hpke"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
